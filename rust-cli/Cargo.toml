[package]
name = "codebase-context-graph"
version = "0.1.0"
edition = "2024"
description = "Builds a queryable code graph from compiler-grade SCIP indexes (rust-analyzer, scip-typescript, scip-python)"

[[bin]]
name = "codebase-context-graph"
path = "main.rs"

[[bin]]
name = "codebase-context-graph-gui"
path = "gui.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.29"
ignore = "0.4"
# scip pins protobuf to exactly this version.
protobuf = "=3.7.2"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
scip = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
