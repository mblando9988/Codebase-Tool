name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: rust-cli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The runner images ship Rust, but not always the newest release.
      - name: Use the current stable Rust
        id: rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
          echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"

      # The key names the compiler, so a new Rust release starts a fresh cache instead of
      # restoring build output that cargo would only throw away.
      - name: Cache dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-cli/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.commit }}-${{ hashFiles('rust-cli/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.commit }}-

      # No indexer needs to be installed: the tests read the .scip files the real indexers
      # wrote, which are checked in under rust-cli/fixtures.
      - name: Test
        run: cargo test --release --locked --no-fail-fast
